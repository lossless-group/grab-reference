services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: citation_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/init-postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - citation-network

  citation-service:
    build:
      context: .
      dockerfile: ./packages/backend/citation-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/citation_manager
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./packages/shared/prisma:/app/packages/shared/prisma
    networks:
      - citation-network
      
  classifier-service:
    build:
      context: .
      dockerfile: ./packages/backend/classifier-service/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/citation_manager
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./packages/shared/prisma:/app/packages/shared/prisma
    networks:
      - citation-network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - citation-network
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    ports:
      - "5173:5173"
    depends_on:
      - citation-service
      - classifier-service
    environment:
      - VITE_PORT=5173
    volumes:
      # Mount source code directories for hot reloading
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages/shared:/app/packages/shared
      
      # Mount configuration files
      - ./apps/web/.env:/app/apps/web/.env
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/tsconfig.node.json:/app/apps/web/tsconfig.node.json
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/src/stylex.css:/app/apps/web/src/stylex.css
    networks:
      - citation-network

networks:
  citation-network:
    driver: bridge

volumes:
  postgres_data: {}
  pgadmin_data: {}
  outerbase_data: {}
